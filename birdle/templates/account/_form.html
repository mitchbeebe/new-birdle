{# Renders an allauth form with Bootstrap classes. Expects: form, submit_label, action (optional). #}
<form method="post" action="{{ action|default:'' }}">
    {% csrf_token %}
    {{ redirect_field }}
    {% include 'account/_fields.html' %}
    <button type="submit" class="btn btn-primary w-100">{{ submit_label }}</button>
</form>
